name: Android uygulaması
# Arayüz ya da Android kodu değişince APK'yı derler ve "uygulama" sürümüne yükler.
on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', 'app.js', 'app.css', 'analysis.js', 'chart.js', 'config.js', 'engine/ta_engine.js', 'icons/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Arayüz dosyalarını uygulamaya kopyala
        run: |
          W=android/app/src/main/assets/www
          rm -rf "$W" && mkdir -p "$W/engine" "$W/icons" "$W/data"
          cp index.html app.js app.css config.js "$W/"
          for f in analysis.js chart.js; do if [ -f "$f" ]; then cp "$f" "$W/"; fi; done
          cp engine/ta_engine.js "$W/engine/"
          cp icons/*.png "$W/icons/"
          cp data/app_data.json "$W/data/" || true
          ls -R "$W" | head -40
      - name: İmza anahtarını önbellekten al
        id: imza
        uses: actions/cache@v5
        with:
          path: ~/.gmi-imza
          key: gmi-imza-v1
      - name: İmza anahtarı yoksa oluştur
        if: steps.imza.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.gmi-imza
          P=$(openssl rand -hex 16); printf '%s' "$P" > ~/.gmi-imza/pass
          keytool -genkeypair -keystore ~/.gmi-imza/imza.p12 -storetype PKCS12 -storepass "$P" -keypass "$P" -alias gmi -keyalg RSA -keysize 2048 -validity 12000 -dname "CN=GMI Piyasa, O=Kisisel, C=TR"
      - name: APK derle
        run: |
          export GMI_KEYSTORE="$HOME/.gmi-imza/imza.p12"
          export GMI_KEYSTORE_PASS="$(cat "$HOME/.gmi-imza/pass")"
          gradle -p android assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace
      - name: Yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk gmi-piyasa.apk
          ls -la gmi-piyasa.apk
          T="GMI Piyasa (Android) 2.0.${{ github.run_number }}"
          N="Son derleme: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M') TSİ · ${GITHUB_SHA::7}"
          if gh release view uygulama > /dev/null 2>&1; then
            gh release upload uygulama gmi-piyasa.apk --clobber
            gh release edit uygulama --title "$T" --notes "$N"
          else
            gh release create uygulama gmi-piyasa.apk --title "$T" --notes "$N"
          fi
