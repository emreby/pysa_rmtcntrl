name: Kaynak testi
on:
  push:
    branches: [main]
    paths: ['engine/probe.mjs', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Kaynakları dene
        run: node engine/probe.mjs
      - name: Sonucu "tani" dalına yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp out/probe.json /tmp/probe.json
          git checkout --orphan tani
          git rm -rf --cached . > /dev/null
          rm -rf ./*
          cp /tmp/probe.json probe.json
          git add probe.json
          git commit -m "Kaynak testi sonucu"
          git push -f origin tani
